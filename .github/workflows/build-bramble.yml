name: Dump Pixel 4a 5G Hook Locations

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git

      - name: Create Google kernel layout
        run: |
          mkdir -p kernel/private

      - name: Clone redbull kernel source
        run: |
          git clone --depth=1 \
            -b android-msm-redbull-4.19-android11-qpr3 \
            https://android.googlesource.com/kernel/msm \
            kernel/private/msm-google

      - name: Dump hook locations
        working-directory: kernel/private/msm-google
        run: |
          echo "===== fs/exec.c ====="
          grep -n "do_execve" fs/exec.c || true
          sed -n '1800,1960p' fs/exec.c

          echo "===== fs/open.c ====="
          grep -n "faccessat" fs/open.c || true
          sed -n '330,450p' fs/open.c

          echo "===== fs/read_write.c ====="
          grep -n "SYSCALL_DEFINE3(read" fs/read_write.c || true
          sed -n '540,620p' fs/read_write.c

          echo "===== fs/stat.c ====="
          grep -n "newfstatat" fs/stat.c || true
          sed -n '330,410p' fs/stat.c

          echo "===== kernel/reboot.c ====="
          grep -n "SYSCALL_DEFINE4(reboot" kernel/reboot.c || true
          sed -n '250,340p' kernel/reboot.c
