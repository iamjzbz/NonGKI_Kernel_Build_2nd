name: Build Pixel 4a 5G Bramble Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            curl \
            flex \
            git \
            libncurses5-dev \
            libssl-dev \
            lz4 \
            python3 \
            python-is-python3 \
            unzip \
            zip

      - name: Clone kernel source
        run: |
          git clone --depth=1 \
            -b android-msm-redbull-4.19-android11-qpr3 \
            https://android.googlesource.com/kernel/msm \
            kernel

      - name: Clone Google kernel build scripts
        run: |
          git clone --depth=1 \
            -b master-kernel-build-2021 \
            https://android.googlesource.com/kernel/build \
            kernel/build

      - name: Build redbull kernel
        working-directory: kernel
        run: |
          chmod +x build_redbull.sh
          chmod +x build/build.sh
          ./build_redbull.sh

      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: bramble-redbull-kernel
          path: |
            kernel/out/**
            kernel/dist/**
            kernel/arch/arm64/boot/**
