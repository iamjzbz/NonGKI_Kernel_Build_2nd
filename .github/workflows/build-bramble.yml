name: Build Pixel 4a 5G Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install packages
        run: |
          sudo apt update
          sudo apt install -y git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses5 \
            libssl-dev python3 python-is-python3 bc lz4

      - name: Clone redbull kernel
        run: |
          git clone --depth=1 \
            -b android-msm-redbull-4.19-android11-qpr3 \
            https://android.googlesource.com/kernel/msm kernel

      - name: Add KernelSU-Next legacy
        working-directory: kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

      - name: Build stock first
        working-directory: kernel
        run: |
          chmod +x build_redbull.sh
          ./build_redbull.sh

      - name: Upload kernel output
        uses: actions/upload-artifact@v4
        with:
          name: bramble-redbull-kernel-output
          path: |
            kernel/out/**
            kernel/dist/**
            kernel/arch/arm64/boot/Image*
