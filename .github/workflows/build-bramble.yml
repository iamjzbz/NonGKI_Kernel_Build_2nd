name: Build Pixel 4a 5G Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential curl flex git \
            gcc-arm-linux-gnueabi \
            libncurses5-dev libssl-dev lz4 \
            python3 python-is-python3 unzip zip

      - name: Create Google kernel layout
        run: |
          mkdir -p kernel/private

      - name: Clone redbull kernel source
        run: |
          git clone --depth=1 \
            -b android-msm-redbull-4.19-android11-qpr3 \
            https://android.googlesource.com/kernel/msm \
            kernel/private/msm-google

      - name: Clone Google kernel build scripts
        run: |
          git clone --depth=1 \
            -b master-kernel-build-2021 \
            https://android.googlesource.com/kernel/build \
            kernel/build

      - name: Add KernelSU-Next legacy
        working-directory: kernel/private/msm-google
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
          
      - name: Apply WildKernels manual hooks plus redbull fixes
        working-directory: kernel/private/msm-google
        run: |
          curl -L \
            https://raw.githubusercontent.com/WildKernels/kernel_patches/aaaf89639daedac270b7e17e4200d664ca4ef525/next/scope_min_manual_hooks_v1.6.patch \
            -o scope_min_manual_hooks_v1.6.patch

          git apply --reject --whitespace=fix scope_min_manual_hooks_v1.6.patch || true

          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if new in s:
                  print(f"{path}: already patched")
                  return
              if old not in s:
                  raise SystemExit(f"Pattern not found in {path}")
              p.write_text(s.replace(old, new, 1))
              print(f"{path}: patched")

          replace("fs/exec.c",
          """static int do_execveat_common(int fd, struct filename *filename,
          			      struct user_arg_ptr argv,
          			      struct user_arg_ptr envp,
          			      int flags)
          {
          	return __do_execve_file(fd, filename, argv, envp, flags, NULL);
          }""",
          """#ifdef CONFIG_KSU
          extern bool ksu_execveat_hook __read_mostly;
          extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,
          				void *argv, void *envp, int *flags);
          extern int ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr,
          				void *argv, void *envp, int *flags);
          #endif

          static int do_execveat_common(int fd, struct filename *filename,
          			      struct user_arg_ptr argv,
          			      struct user_arg_ptr envp,
          			      int flags)
          {
          #ifdef CONFIG_KSU
          	if (unlikely(ksu_execveat_hook))
          		ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);
          	else
          		ksu_handle_execveat_sucompat(&fd, &filename, &argv, &envp, &flags);
          #endif
          	return __do_execve_file(fd, filename, argv, envp, flags, NULL);
          }""")

          replace("fs/open.c",
          """long do_faccessat(int dfd, const char __user *filename, int mode)
          {
          	const struct cred *old_cred;""",
          """#ifdef CONFIG_KSU
          extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,
          				int *mode, int *flags);
          #endif

          long do_faccessat(int dfd, const char __user *filename, int mode)
          {
          #ifdef CONFIG_KSU
          	ksu_handle_faccessat(&dfd, &filename, &mode, NULL);
          #endif
          	const struct cred *old_cred;""")
          PY

          git diff -- fs/exec.c fs/open.c fs/read_write.c fs/stat.c kernel/reboot.c drivers/input/input.c
          
      - name: Enable KernelSU manual hook config
        working-directory: kernel/private/msm-google
        run: |
          cat >> arch/arm64/configs/redbull_defconfig <<'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          # CONFIG_KSU_KPROBES_HOOK is not set
          # CONFIG_KSU_HOOK_KPROBES is not set
          # CONFIG_KSU_WITH_KPROBES is not set
          EOF

      - name: Build kernel Image only
        working-directory: kernel
        run: |
          chmod +x build/build.sh
          BUILD_CONFIG=private/msm-google/build.config.redbull.no-cfi build/build.sh

      - name: Show outputs
        run: |
          find kernel -type f \( -name "Image" -o -name "Image.gz" -o -name "Image.lz4" -o -name "Image.lz4-dtb" \) -print

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pixel4a5G-bramble-kernel
          path: |
            kernel/out/**/Image
            kernel/out/**/Image.gz
            kernel/out/**/Image.lz4
            kernel/out/**/Image.lz4-dtb
