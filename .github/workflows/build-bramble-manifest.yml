name: Build Pixel 4a 5G Kernel Manifest

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            curl \
            flex \
            git \
            gnupg \
            libncurses5-dev \
            libssl-dev \
            lz4 \
            python3 \
            python-is-python3 \
            unzip \
            zip

      - name: Install repo tool
        run: |
          mkdir -p ~/.bin
          curl -L https://storage.googleapis.com/git-repo-downloads/repo -o ~/.bin/repo
          chmod +x ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: Repo init redbull kernel manifest
        run: |
          mkdir kernel
          cd kernel
          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b android-msm-redbull-4.19-android11-qpr3

      - name: Repo sync
        working-directory: kernel
        run: |
          repo sync -c --no-tags --no-clone-bundle --optimized-fetch -j2 --fail-fast

      - name: Add KernelSU-Next legacy
        working-directory: kernel/private/msm-google
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

      - name: Apply WildKernels manual hooks
        working-directory: kernel/private/msm-google
        run: |
          curl -L \
            https://raw.githubusercontent.com/WildKernels/kernel_patches/aaaf89639daedac270b7e17e4200d664ca4ef525/next/scope_min_manual_hooks_v1.6.patch \
            -o scope_min_manual_hooks_v1.6.patch

          git apply --reject --whitespace=fix scope_min_manual_hooks_v1.6.patch || true

      - name: Enable KernelSU manual config
        working-directory: kernel/private/msm-google
        run: |
          cat >> arch/arm64/configs/redbull_defconfig <<'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          # CONFIG_KPROBES is not set
          # CONFIG_KPROBE_EVENTS is not set
          # CONFIG_KSU_KPROBES_HOOK is not set
          # CONFIG_CC_WERROR is not set
          EOF

      - name: Disable check_defconfig
        working-directory: kernel/private/msm-google
        run: |
          sed -i \
            's/check_defconfig && update_nocfi_config/update_nocfi_config/' \
            build.config.redbull.no-cfi

          grep POST_DEFCONFIG_CMDS build.config.redbull.no-cfi

      - name: Verify KernelSU manual hook
        working-directory: kernel/private/msm-google
        run: |
          grep -R "ksu_handle_sys_reboot" -n kernel/reboot.c || true
          grep -R "ksu_handle_execveat" -n fs/exec.c || true
          grep -n "CONFIG_KSU" arch/arm64/configs/redbull_defconfig || true

      - name: Build kernel Image only
        working-directory: kernel
        run: |
          chmod +x build/build.sh

          CONFIG_KSU=y \
          CONFIG_KSU_MANUAL_HOOK=y \
          LLVM=1 \
          LLVM_IAS=1 \
          BUILD_CONFIG=private/msm-google/build.config.redbull.no-cfi \
          build/build.sh

      - name: Show outputs
        run: |
          find kernel -type f \( \
            -name "Image" -o \
            -name "Image.gz" -o \
            -name "Image.lz4" -o \
            -name "Image.lz4-dtb" \
          \) -print

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pixel4a5G-bramble-kernel-manifest
          path: |
            kernel/out/**/Image
            kernel/out/**/Image.gz
            kernel/out/**/Image.lz4
            kernel/out/**/Image.lz4-dtb
