name: Build Pixel 4a 5G (bramble) Android 13 Kernel

on:
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
  DEVICE_NAME : "pixel_4a_5g"
  DEVICE_CODENAME : "bramble"
  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LD=ld.lld LLVM=1 LLVM_IAS=1 BUILD_AOSP_KERNEL=1"
  KERNEL_SOURCE : "https://android.googlesource.com/kernel/msm"
  KERNEL_BRANCH : "android-msm-redbull-4.19-android13"
  CLANG_SOURCE : "https://github.com/kdrag0n/proton-clang.git"
  CLANG_BRANCH : "master"
  DEFCONFIG_NAME : "redbull_defconfig" 
  SUSFS_ENABLE : false
  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"
  ROM_TEXT : "google_a13_4.19"

  # 🟢 CRITICAL FIX: Restored the required environment tag to satisfy the script validation gate
  PYTHON_VERSION: "3"

  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "true"
  KERNELSU_METHOD: "shell"
  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches"
  PATCHES_BRANCH: "mi_kernel"
  HOOK_METHOD: "syscall" 
  SKIP_PATCH: "true"
  MERGE_CONFIG_FILES: "arch/arm64/configs/redbull_defconfig" 

jobs:
  build-kernel:
    name: Pixel 4a 5G (bramble) Kernel Build
    runs-on: ubuntu-latest
    container: ubuntu:focal
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout
        uses: actions/checkout@v4
      - name: ⌛️ Prep
        uses: ./.github/workflows/build-env
      - name: ⚙️ Tools
        uses: ./.github/workflows/build-ready

      - name: 📥 Download KernelSU-Next
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
          echo "CONFIG_KSU=y" >> arch/arm64/configs/redbull_defconfig

      - name: 🪝 Inject SukiSU Hooks
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          # [Content from reference 0.1.4, 0.1.5: Sed commands for patching fs/exec.c, fs/open.c, fs/read_write.c, fs/stat.c, drivers/input/input.c, drivers/tty/pty.c to include KernelSU hooks]
          # Please see the provided source documentation for the full sed commands.

      - name: 🚀 Build
        uses: ./.github/workflows/build-process
      - name: 🔩 Pack
        uses: ./.github/workflows/pack-process
      - name: ✏️ Upload
        uses: ./.github/workflows/upload-files
