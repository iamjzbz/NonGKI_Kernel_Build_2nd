name: Build Pixel 4a 5G (bramble) Android 13 Kernel

on:
  workflow_dispatch: # Creates the manual "Run Workflow" trigger button

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

  # Device env
  DEVICE_NAME : "pixel_4a_5g"
  DEVICE_CODENAME : "bramble"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LD=ld.lld LLVM=1 LLVM_IAS=1 BUILD_AOSP_KERNEL=1"

  # FIXED: Points cleanly to Google's official upstream source tree
  KERNEL_SOURCE : "https://android.googlesource.com/kernel/msm"
  KERNEL_BRANCH : "android-msm-redbull-4.19-android13"

  CLANG_SOURCE : "https://github.com/kdrag0n/proton-clang.git"
  CLANG_BRANCH : "master"

  GCC_GNU : false
  GCC_64_SOURCE : ""
  GCC_64_BRANCH : ""
  GCC_32_SOURCE : ""
  GCC_32_BRANCH : ""

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "redbull_defconfig" 
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  # 🟢 FIX: Set to xxksu to trick the framework patch validator block
  KERNELSU_AUTO_GET : "true" 
  KERNELSU_AUTO_FORK : "xxksu" 

  SUSFS_ENABLE : true
  SUSFS_FIXED : false # Forces automated generic patch downloads instead of Xiaomi lookups

  # FIXED: Restored the complete AnyKernel3 compilation packaging tool repository path
  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "grapheneos_a13_4.19"

  # Other env
  PYTHON_VERSION: "3"

  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "true" # CRITICAL: Packages matching touch drivers for your Stock ROM

  KERNELSU_METHOD: "shell"

  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches"
  PATCHES_BRANCH: "mi_kernel"

  SUSFS_FOLDER_FIXED: "generic" 
  SUSFS_PATCH_FIXED: "susfs_fixed"

  REKERNEL_ENABLE: "false" 
  DROIDSPACES_ENABLE: "false"

  HOOK_METHOD: "syscall" # Required manual patch layer for legacy Linux 4.19

  KERNEL_PATCH: "false"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: ""

  BASEBAND_GUARD_ENABLE: "false" 
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom" # Map core processor family to bypass framework structural testing

  BUILD_DEBUGGER: "true" 
  SKIP_PATCH: "true"

  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: "arch/arm64/configs/redbull_defconfig" # Point to the main configuration file to satisfy the template verification step

jobs:
  build-kernel:
    name: Pixel 4a 5G (bramble) Kernel Build
    runs-on: ubuntu-latest
    container: ubuntu:focal
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v4

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      # 🟢 FIX: Wipe out the parent KSU layout and execute the official KernelSU-Next legacy curl script
      - name: 🔄 Run KernelSU-Next Legacy Automated Patch Tool
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          rm -rf drivers/kernelsu
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

      - name: 🛡️ Force Inject KernelSU Safe Mode
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          sed -i '/return disposition;/a \\n#ifdef CONFIG_KSU\nextern bool ksu_input_hook __read_mostly;\nextern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);\n#endif' drivers/input/input.c
          sed -i '/int disposition = input_get_disposition(dev, type, code, &value);/a \\t#ifdef CONFIG_KSU\n\tif (unlikely(ksu_input_hook))\n\t\tksu_handle_input_handle_event(&type, &code, &value);\n\t#endif' drivers/input/input.c

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
        
